name: Regression suite

# Runs tests/run.sh — the role-impersonation SQL suite (wrapped in a
# rolled-back transaction, safe against the live linked project) plus the
# HTTP check that the anon key can't reach anything it shouldn't.
#
# Needs repo secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF,
# SUPABASE_DB_PASSWORD, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY.
# (The last two are the client-safe anon key/URL already in .env.local
# locally — not secret in the security sense, just not committed.)

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "tests/**"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "tests/**"
  workflow_dispatch: {}

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Write .env.local for the HTTP check
        run: |
          cat > .env.local <<EOF
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          EOF

      - name: Run regression suite
        run: ./tests/run.sh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
